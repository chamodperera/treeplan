<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TreePlan</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>body{font:13px Segoe UI,sans-serif;margin:10px}h4{margin:12px 0 4px}button,select{margin:2px;padding:5px 8px;font:inherit}#m{color:#c00;min-height:1.2em}#s{background:#eef;padding:5px;border-radius:4px}</style></head><body>
<div id="s">Selected: none</div><div id="m"></div>
<h4>New tree (branches)</h4><div id="nt"></div>
<h4>Selected node</h4>
<button onclick="cv('D')">To decision</button><button onclick="cv('E')">To event</button><button onclick="cv('T')">To terminal</button>
<div>Branches for new node: <select id="nb"><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
<h4>Edit</h4>
<button onclick="addB()">Add branch</button><button onclick="remB()">Remove branch</button>
<button onclick="cp()">Copy subtree</button><button onclick="ps()">Paste subtree</button>
<button onclick="ins('D')">Insert decision</button><button onclick="ins('E')">Insert event</button>
<h4>Options</h4>
Decision: <select id="mo" onchange="opt()"><option value="max">Maximize</option><option value="min">Minimize</option></select>
Theme: <select id="th" onchange="opt()"><option>Colorful</option><option>Simplified</option><option>Traditional</option></select>
<h4></h4><button onclick="rs()">Reset (clear tree)</button>
<p style="color:#666">Click a node (■ decision, ● event, ▶ terminal) or its value in the sheet to select it. Edit labels, payoffs and probabilities directly in the cells; they are kept when the tree is redrawn.</p>
<script>
let T=null,clip=null,busy=false;
const TH={Colorful:{D:'#2e75b6',E:'#c55a11',T:'#548235'},Simplified:{D:'#000',E:'#000',T:'#000'},Traditional:{D:'#c00000',E:'#1f3864',T:'#7f7f7f'}},SY={D:'■',E:'●',T:'▶'};
const kids=id=>T.nodes.filter(n=>n.p===id),byId=id=>T.nodes.find(n=>n.id===id),root=()=>T.nodes.find(n=>n.p<0),R=(r,c)=>`R${r+1}C${c+1}`;
const mk=(p,t,l)=>{const n={id:T.next++,p,t,l:l||'',pay:0,pr:0};T.nodes.push(n);return n};
const desc=id=>kids(id).flatMap(k=>[k.id,...desc(k.id)]),rm=ids=>T.nodes=T.nodes.filter(n=>!ids.includes(n.id));
const msg=t=>document.getElementById('m').textContent=t||'';
const save=()=>{Office.context.document.settings.set('tp',JSON.stringify(T));Office.context.document.settings.saveAsync()};
function layout(){let leaf=0,pos={};(function go(n,d){const k=kids(n.id);let r;if(!k.length)r=T.r0+1+4*leaf++;else{const rs=k.map(c=>go(c,d+1));r=Math.round((rs[0]+rs[rs.length-1])/2)}pos[n.id]={r,x:T.c0+4*d};return r})(root(),0);return pos}
function S(){const n=T&&T.sel!=null&&byId(T.sel);if(!n)throw Error('Click a node in the sheet first.');return n}
function eqProb(p){const k=kids(p);k.forEach(c=>c.pr=1/k.length)}
async function clearOld(ctx){if(!T)return;const ws=ctx.workbook.worksheets.getItem(T.sheet),p=layout();let mr=0,mc=0;for(const k in p){mr=Math.max(mr,p[k].r);mc=Math.max(mc,p[k].x)}
 ws.getRangeByIndexes(T.r0,T.c0,mr+3-T.r0,mc+4-T.c0).clear();await ctx.sync();
 try{ws.shapes.load('items/name');await ctx.sync();ws.shapes.items.filter(s=>s.name.startsWith('tp_')).forEach(s=>s.delete());await ctx.sync()}catch(e){}}
async function pull(ctx){const ws=ctx.workbook.worksheets.getItem(T.sheet),p=layout(),rs={};
 T.nodes.forEach(n=>{if(n.p>=0){const q=p[n.id];rs[n.id]=ws.getRangeByIndexes(q.r-1,q.x,3,1).load('values')}});await ctx.sync();
 T.nodes.forEach(n=>{const g=rs[n.id];if(g){const v=g.values;n.l=String(v[0][0]);n.pay=v[1][0]===''?0:v[1][0];n.pr=v[2][0]===''?0:v[2][0]}})}
async function render(ctx){const ws=ctx.workbook.worksheets.getItem(T.sheet),p=layout(),th=TH[T.theme],g={};
 const path=n=>{const a=[];while(n.p>=0){a.push(n);n=byId(n.p)}return a};
 T.nodes.forEach(n=>{const q=p[n.id],k=kids(n.id),pr=m=>R(p[m.id].r+1,p[m.id].x),vl=m=>R(p[m.id].r,p[m.id].x+2);let f;
  if(n.t==='T')f='=SUM('+path(n).map(m=>R(p[m.id].r,p[m.id].x)).join(',')+')';
  else if(n.t==='D')f='='+(T.mode==='min'?'MIN':'MAX')+'('+k.map(vl).join(',')+')';
  else f='=IF(ABS(1-SUM('+k.map(pr).join(',')+'))<=0.00001,SUM('+k.map(m=>pr(m)+'*'+vl(m)).join(',')+'),NA())';
  const mkc=ws.getRangeByIndexes(q.r,q.x+1,1,1),vc=ws.getRangeByIndexes(q.r,q.x+2,1,1);
  mkc.values=[[SY[n.t]]];mkc.format.font.color=th[n.t];mkc.format.font.bold=true;mkc.format.horizontalAlignment='Center';
  vc.formulasR1C1=[[f]];vc.numberFormat=[['#,##0.00']];vc.format.font.color=th[n.t];vc.format.font.bold=true;
  if(n.p>=0){ws.getRangeByIndexes(q.r-1,q.x,1,1).values=[[n.l]];const pc=ws.getRangeByIndexes(q.r,q.x,1,1);pc.values=[[n.pay]];pc.numberFormat=[['#,##0.00']];
   if(byId(n.p).t==='E'){const e=ws.getRangeByIndexes(q.r+1,q.x,1,1);e.values=[[n.pr]];e.numberFormat=[['0.0%']];e.format.font.color='#7f7f7f'}}
  });
 const bd=(r,c,h,w,e)=>{const b=ws.getRangeByIndexes(r,c,h,w).format.borders.getItem(e);b.style='Continuous';b.color='#444';b.weight='Medium'};
 T.nodes.forEach(n=>{if(n.p<0)return;const a=p[n.p],q=p[n.id];
  bd(a.r,a.x+2,1,2,'EdgeBottom');          /* stub right of the parent value */
  bd(q.r,q.x,1,1,'EdgeBottom');            /* line under the branch label */
  const lo=Math.min(a.r,q.r),hi=Math.max(a.r,q.r);
  if(hi>lo)bd(lo+1,a.x+3,hi-lo,1,'EdgeRight')}); /* vertical joint */
 await ctx.sync();save();show()}
async function op(fn){if(busy)return;busy=true;msg();try{await Excel.run(fn)}catch(e){msg(e.message)}busy=false}
const mut=f=>op(async ctx=>{if(!T)throw Error('Create a tree first.');await pull(ctx);await clearOld(ctx);f();await render(ctx)});
function nt(n){op(async ctx=>{const a=ctx.workbook.getActiveCell();a.load('rowIndex,columnIndex');a.worksheet.load('name');await ctx.sync();
 const old=T;if(T)await clearOld(ctx);T={sheet:a.worksheet.name,r0:a.rowIndex,c0:a.columnIndex,next:0,nodes:[],sel:null,mode:old?old.mode:document.getElementById('mo').value,theme:old?old.theme:document.getElementById('th').value};
 const r=mk(-1,'D');for(let i=1;i<=n;i++)mk(r.id,'T','Option '+i);await render(ctx)})}
function cv(t){const n=+document.getElementById('nb').value;mut(()=>{const s=S();if(t==='T'){if(s.p<0)throw Error('Root cannot be terminal.');rm(desc(s.id))}
 else if(!kids(s.id).length){for(let i=1;i<=n;i++)mk(s.id,'T',(t==='E'?'Outcome ':'Option ')+i);if(t==='E')eqProb(s.id)}s.t=t})}
function addB(){mut(()=>{let s=S();if(s.t==='T')s=byId(s.p);const c=mk(s.id,'T','New branch');if(s.t==='E')c.pr=0})}
function remB(){mut(()=>{const s=S();if(s.p<0)throw Error('Select a branch, not the root.');const p=byId(s.p);rm([s.id,...desc(s.id)]);if(!kids(p.id).length){if(p.p<0)mk(p.id,'T','Option 1');else p.t='T'}})}
function cp(){op(async()=>{const s=S();clip=JSON.parse(JSON.stringify([s,...desc(s.id).map(byId)]));msg('Copied.')})}
function ps(){mut(()=>{if(!clip)throw Error('Nothing copied.');let s=S(),par=s;if(s.t==='T'){par=byId(s.p);rm([s.id])}
 const m={};clip.forEach(c=>m[c.id]=T.next++);clip.forEach((c,i)=>T.nodes.push({...c,id:m[c.id],p:i?m[c.p]:par.id}))})}
function ins(t){mut(()=>{const s=S(),i=T.nodes.indexOf(s),n={id:T.next++,p:s.p,t,l:s.l,pay:s.pay,pr:s.pr};T.nodes.splice(i,0,n);s.p=n.id;s.l=t==='E'?'Outcome 1':'Option 1';s.pay=0;mk(n.id,'T',t==='E'?'Outcome 2':'Option 2');if(t==='E')eqProb(n.id)})}
function opt(){if(!T)return;mut(()=>{T.mode=document.getElementById('mo').value;T.theme=document.getElementById('th').value})}
function rs(){op(async ctx=>{await clearOld(ctx);T=null;save();show()})}
function show(){document.getElementById('s').textContent=T&&T.sel!=null&&byId(T.sel)?`Selected: ${SY[byId(T.sel).t]} ${byId(T.sel).l||'(root)'}`:'Selected: none'}
function onSel(e){if(!T)return;const parts=e.address.split('!'),sh=parts.length>1?parts[0].replace(/'/g,''):T.sheet;if(sh!==T.sheet)return;
 const m=parts.pop().match(/^\$?([A-Z]+)\$?(\d+)/);if(!m)return;const c=[...m[1]].reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1,r=+m[2]-1,p=layout();
 for(const n of T.nodes){const q=p[n.id];if(c>=q.x&&c<=q.x+2&&Math.abs(r-q.r)<=(c===q.x?1:0)){T.sel=n.id;show();return}}}
Office.onReady(()=>{const d=document.getElementById('nt');for(let i=2;i<=5;i++)d.innerHTML+=`<button onclick="nt(${i})">${i}</button>`;
 try{const s=Office.context.document.settings.get('tp');if(s){T=JSON.parse(s);document.getElementById('mo').value=T.mode;document.getElementById('th').value=T.theme}}catch(e){}
 Excel.run(async ctx=>{ctx.workbook.worksheets.onSelectionChanged.add(async e=>onSel(e));await ctx.sync()});show()});
</script></body></html>
